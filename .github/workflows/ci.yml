name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Quality tools are not run on GitHub-hosted runners.
# synapse-sentinel/quality-runners clones the PR, runs Pint / Pest / PHPStan / Rector,
# and posts commit statuses (quality-runners/{tool}, quality-runners/gate).
# Merge still requires those green. Do not add a second runner here.
# https://github.com/synapse-sentinel/quality-runners

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pointer:
    name: quality-runners is the house gate
    runs-on: ubuntu-latest
    steps:
      - name: Point at the house runner
        run: |
          echo "conduit-ui/cloudflare quality is synapse-sentinel/quality-runners, not this workflow."
          echo "https://github.com/synapse-sentinel/quality-runners"
          echo "This job does not run Pint, Pest, PHPStan, or Rector."
